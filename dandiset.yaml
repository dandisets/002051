description: This dataset contains highly multiplexed fluorescence microscopy images
  acquired with Amplification by Cyclic Extension (ACE), an in situ signal amplification
  technology, across sequential rounds of RNA and protein staining. It includes Py2T
  cells, a thin mouse brain section, and three-dimensional mouse brain tissue volumes,
  enabling visualization of molecular distributions, cellular architecture, and spatial
  organization.
